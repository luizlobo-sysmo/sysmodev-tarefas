# ---------------------------------------------------------------------------
# Tarefas - backend
#
# Historico das tarefas do Redmine: as que fiz e as que acompanho. Sem credencial
# do Redmine aqui - quem conversa com o Redmine e a skill /sysmo-redmine-work, que
# grava neste app pela API. O app so le e grava a base local.
# ---------------------------------------------------------------------------

quarkus.application.name=tarefas-backend

# Somente loopback: e um app de uso pessoal na maquina, nao servico de rede.
quarkus.http.host=127.0.0.1
quarkus.http.port=${BACKEND_PORT:5003}

# Frontend Vite na 8003. content-type e obrigatorio no preflight de POST/PUT com
# corpo JSON - e o text/csv da importacao.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8003,http://127.0.0.1:8003
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=content-type

# ---------------------------------------------------------------------------
# Base local (SQLite)
#
# A MESMA base do Controle de Horas. E la que estao as horas de cada tarefa, e o
# historico existe em boa parte para responder "quanto tempo foi nesta tarefa" -
# com dois arquivos, a resposta exigiria abrir os dois e juntar na mao.
#
# Tres niveis de ../: o processo roda em SysmoDev/tarefas/backend, e a pasta db
# fica na raiz do monorepo.
# ---------------------------------------------------------------------------

base.arquivo=${BASE_TRABALHO:../../../db/trabalho.db}

# Health check em /q/health
quarkus.smallrye-health.root-path=/q/health
