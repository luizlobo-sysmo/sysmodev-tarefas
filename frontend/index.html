<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SysmoDev Tarefas</title>
    <!-- Marca do projeto (TF), a mesma do cabecalho: faviconSvg(MARCAS.tarefas) do comum. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20x%3D'2'%20y%3D'2'%20width%3D'60'%20height%3D'60'%20rx%3D'14'%20fill%3D'%23ea580c'%2F%3E%3Ctext%20x%3D'32'%20y%3D'43'%20font-size%3D'30'%20font-family%3D'Segoe%20UI%2CInter%2Csans-serif'%20font-weight%3D'700'%20fill%3D'white'%20text-anchor%3D'middle'%3ETF%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <script>
      // Aplica o tema ANTES da primeira pintura, como no Controle de Horas: feito no
      // React, a pagina apareceria clara por um quadro antes de escurecer.
      try {
        var t = (localStorage.getItem('sysmodev.tema') || localStorage.getItem('tarefas.tema'));
        if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
        else if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {
        // localStorage bloqueado: segue no tema do sistema.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
